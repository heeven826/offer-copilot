# ================= 浏览器 =================
browser:
  debug_port: 9222              # Chrome 调试端口；若该端口已有实例则直接接管
  user_data_dir: "./chrome_profile"   # 独立浏览器配置目录（首次运行扫码登录一次，之后保持登录态）
  headless: false               # 必须保持 false，无头模式极易触发风控

# ================= 职位来源 =================
search:
  source: "expect"              # expect=期望职位推荐页（默认，用你在平台配置的期望）
                                # keyword=关键词搜索（后续支持）
  expect_pages: 2               # 每个期望标签最多翻几页（当前页处理完且无新打招呼时自动翻页，受5分钟节奏限制）
  keywords: ["Python 开发"]     # keyword 模式用
  # 城市代码：北京101010100 上海101020100 广州101280100 深圳101280600
  # 杭州101210100 成都101270100 全国100010000
  city: "101010100"
  max_pages: 3                  # keyword 模式：每个关键词最多翻几页

# ================= 本地硬过滤（AI 之前，零成本、确定性）=================
filter:
  allowed_cities: ["北京"]      # 城市白名单；职位含「远程/在家/remote」放行；留空=不限
  # 薪资按「折算成12薪的月薪下限」过滤（月薪×月数÷12，16薪会折算上去）：
  #   "35-60K·16薪" → 35×16/12 = 47K/月 → 通过
  #   "50-90K·14薪" → 58K/月 → 通过；"55-90K" → 超预期跳过；"25-40K" → 太低跳过
  salary_band_k: [30, 60]
  blacklist_keywords: []        # 命中即跳过，如 ["外包", "驻场", "兼职"]

# ================= AI =================
ai:
  min_score: 7                  # 精评（第2阶段，含JD）阈值：决定是否打招呼
  stage1_score: 6               # 粗筛（第1阶段，仅列表信息）阈值：达到才打开详情精评
  temperature: 0.3

# ================= 打招呼 / 投递 =================
apply:
  send_greeting: true           # 发送 AI 生成的个性化打招呼话术
  send_resume_card: false       # 打招呼后是否在聊天中发送简历卡片（TODO: 联调阶段实现）
  default_greeting: "您好，看到这个职位和我的经历比较匹配，希望能和您进一步沟通，期待您的回复！"
  # ----- 收件箱（打完招呼后检查未读消息）-----
  check_inbox: true             # 是否启用
  inbox_max_conversations: 5    # 每次最多处理几个未读会话
  inbox_send: true              # false=观察模式：只记录 AI 决策日志，不实际回复/发简历

# ================= 频控 / 安全 =================
rate:
  # 间隔格式 [下限, 上限] 秒，每次随机取值（上限=最快频率+随机量）
  between_greets: [60, 70]      # 两次打招呼：最快 60s 一个（±随机）
  between_details: [30, 40]     # 两次打开职位详情：最快 30s 一个
  between_pages: [300, 420]     # 翻页/切换期望标签：最快 5 分钟一次
  rest_chance: 0.25             # 每次打招呼后额外"长休息"的概率（拟人）
  rest_range: [15, 45]          # 长休息时长区间（秒）
  daily_greet_limit: 40         # 每日打招呼上限（平台普通用户约 100 次/天，保守设置保号）
  pause_on_risk: true           # 检测到安全验证时暂停，等人工处理后继续（不自动破解验证）
