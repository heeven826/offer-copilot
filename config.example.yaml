# ============ offer-copilot 配置模板 ============
# 复制本文件为 config.yaml 并按需调整（config.yaml 不会入库）

# ================= 浏览器 =================
browser:
  debug_port: 9222              # Chrome 调试端口；该端口已有实例则直接接管
  user_data_dir: "./chrome_profile"   # 独立浏览器配置目录（首次运行扫码登录一次，之后保持登录态）
  headless: false               # 必须保持 false，无头模式极易触发风控

# ================= 职位来源 =================
search:
  source: "expect"              # expect=期望职位推荐页（默认，用你在平台配置的期望）
  expect_pages: 2               # 每个期望标签最多翻几页（当前页处理完且无新打招呼时自动翻页）

# ================= 本地硬过滤（AI 之前，零成本、确定性）=================
filter:
  allowed_cities: []            # 城市白名单，如 ["北京"]；职位含「远程/在家/remote」自动放行；空=不限
  # 薪资按「折算成12薪的月薪下限」过滤（月薪×月数÷12，16薪会折算上去）：
  #   "35-60K·16薪" → 47K/月；"50-90K·14薪" → 58K/月
  # 上限设 null = 不限高。上限是"刻意收紧的召回过滤"——想减少高薪错配再设具体值
  salary_band_k: [25, null]
  blacklist_keywords: []        # 命中即跳过，如 ["外包", "驻场", "兼职"]

# ================= AI（仅自主模式 run 需要；agent 模式无需）=================
ai:
  min_score: 7                  # 精评（第2阶段，含JD）阈值：决定是否打招呼
  stage1_score: 6               # 粗筛（第1阶段，仅列表信息）阈值：达到才打开详情精评
  temperature: 0.3

# ================= 打招呼 / 投递 =================
apply:
  send_greeting: true
  send_resume_card: false
  default_greeting: "您好，看到这个职位和我的经历比较匹配，希望能和您进一步沟通！"
  # ----- 收件箱（打完招呼后检查未读消息）-----
  check_inbox: true
  inbox_max_conversations: 5
  inbox_send: true              # false=观察模式：只记录 AI 决策日志，不实际回复/发简历

# ================= 频控 / 安全 =================
rate:
  # 间隔格式 [下限, 上限] 秒，每次随机取值（上限=最快频率+随机量）
  between_greets: [60, 70]      # 两次打招呼：最快 60s 一个（±随机）
  between_details: [30, 40]     # 两次打开职位详情：最快 30s 一个
  between_pages: [300, 420]     # 翻页/切换期望标签：最快 5 分钟一次
  rest_chance: 0.25             # 每次打招呼后额外"长休息"的概率（拟人）
  rest_range: [15, 45]          # 长休息时长区间（秒）
  daily_greet_limit: 40         # 每日打招呼上限（保守设置保号，勿调高）
  pause_on_risk: true           # 检测到安全验证时暂停等人工（不自动破解验证）
